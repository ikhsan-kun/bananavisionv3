# /etc/nginx/sites-available/bananavision
# Nginx Reverse Proxy Config untuk BananaVision Self-Hosted Server
#
# Setup:
#   sudo cp nginx/bananavision.conf /etc/nginx/sites-available/bananavision
#   sudo ln -s /etc/nginx/sites-available/bananavision /etc/nginx/sites-enabled/bananavision
#   sudo nginx -t && sudo nginx -s reload
#
# Ganti YOUR_DOMAIN dengan domain/IP server Anda
# Untuk SSL: sudo certbot --nginx -d YOUR_DOMAIN

# ─── Upstream Services ──────────────────────────────────────────────────
upstream bananavision_node {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream bananavision_python {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ─── HTTP → HTTPS Redirect (aktifkan setelah setup SSL) ─────────────────
# server {
#     listen 80;
#     server_name YOUR_DOMAIN;
#     return 301 https://$server_name$request_uri;
# }

# ─── Main Server Block ───────────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;  # Aktifkan setelah setup SSL
    server_name YOUR_DOMAIN;  # Ganti dengan domain atau IP server

    # SSL Certificate (diisi otomatis oleh certbot)
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ─── Node.js Backend API (/api/) ─────────────────────────────────
    location /api/ {
        proxy_pass http://bananavision_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout untuk upload model yang besar (500MB)
        proxy_connect_timeout   300s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;

        # Batas ukuran body untuk upload model
        client_max_body_size    550M;
    }

    # ─── Python FastAPI (ML predictions & model management) ─────────
    # Endpoint Python server diakses via Node.js, tidak expose langsung ke publik.
    # Jika perlu expose langsung (misalnya untuk testing), uncomment blok ini.
    #
    # location /ml/ {
    #     proxy_pass http://bananavision_python/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 120s;
    #     client_max_body_size 20M;
    # }

    # ─── Health check endpoints ───────────────────────────────────────
    location = /health {
        proxy_pass http://bananavision_node/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Block akses langsung ke folder model (keamanan) ─────────────
    location ~ /models/ {
        deny all;
        return 404;
    }

    # ─── Gzip compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Logs ────────────────────────────────────────────────────────
    access_log /var/log/nginx/bananavision-access.log;
    error_log  /var/log/nginx/bananavision-error.log warn;
}
