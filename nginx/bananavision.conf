upstream bananavision_node {
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream bananavision_python {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name bananavision.ruangprojek.cloud;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Serve React app (static build output)
    root /home/project/bananavisionv3/frontend/dist;
    index index.html;

    # Block direct access to model files
    location ^~ /models/ {
        deny all;
        return 404;
    }

    # Express API
    location /api/ {
        proxy_pass http://bananavision_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout   300s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;

        client_max_body_size    550M;
    }

    # Health check (goes to Node)
    location = /health {
        proxy_pass http://bananavision_node/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Firebase Auth handler (needed for Google OAuth popup)
    location ~ ^/__/auth/ {
        proxy_pass https://tugasakhir-7676b.firebaseapp.com;
        proxy_set_header Host tugasakhir-7676b.firebaseapp.com;
        proxy_ssl_server_name on;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json;

    access_log /var/log/nginx/bananavision-access.log;
    error_log  /var/log/nginx/bananavision-error.log warn;
}
